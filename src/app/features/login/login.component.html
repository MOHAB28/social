<h2 class="text-2xl font-bold text-gray-900">Welcome back</h2>
<p class="text-sm text-gray-500 mb-6">Log in to pick up where you left off.</p>

<form (ngSubmit)="login()" class="space-y-4" [formGroup]="loginForm">
  <app-input-field
    [control]="loginForm.controls.email"
    inputId="email"
    inputType="email"
    label="Email address"
    icon="fa-regular fa-envelope"
    [errorMessages]="{
      required: 'Please enter your email address.',
      email: 'Please enter a valid email address, like name&#64;example.com.',
    }"
  />

  <app-input-field
    [control]="loginForm.controls.password"
    inputId="password"
    inputType="password"
    label="Password"
    icon="fa-solid fa-key"
    [errorMessages]="{ required: 'Please enter your password.' }"
  />

  <div class="flex items-center justify-between">
    <div class="flex items-center">
      <input
        id="remember"
        type="checkbox"
        class="w-4 h-4 text-mainColor bg-gray-100 border-gray-300 rounded-sm focus:ring-mainColor"
      />
      <label for="remember" class="ms-2 text-sm text-gray-600">Remember me</label>
    </div>
    <a routerLink="/forget" class="text-sm font-medium text-mainColor hover:underline"
      >Forgot password?</a
    >
  </div>

  <button
    type="submit"
    class="w-full text-white bg-mainColor hover:bg-teal-800 focus:ring-4 focus:outline-none focus:ring-teal-300 font-semibold rounded-xl text-base px-5 py-3 text-center transition-colors"
  >
    Log In
  </button>
</form>
