<h2 class="text-2xl font-bold text-gray-900">Create a new account</h2>
<p class="text-sm text-gray-500 mb-6">It's quick and easy.</p>

<form (ngSubmit)="register()" class="space-y-4" [formGroup]="registerForm">
  <app-input-field
    [control]="registerForm.controls.name"
    inputId="name"
    label="Full name"
    icon="fa-regular fa-user"
    [errorMessages]="{
      required: 'Please enter your full name.',
      minlength: 'Your name must be at least 3 characters long.',
    }"
  />

  <app-input-field
    [control]="registerForm.controls.userName"
    inputId="username"
    label="Username (optional)"
    icon="fa-solid fa-at"
  />

  <app-input-field
    [control]="registerForm.controls.email"
    inputId="email"
    inputType="email"
    label="Email address"
    icon="fa-regular fa-envelope"
    [errorMessages]="{
      required: 'Please enter your email address.',
      email: 'Please enter a valid email address, like name&#64;example.com.',
    }"
  />

  <!-- Gender is a <select>, not an <input>, so it stays here instead of using app-input-field -->
  @let genderError = registerForm.controls.gender.invalid && registerForm.controls.gender.touched;
  <div>
    <div class="relative">
      <label for="gender" class="sr-only">Gender</label>
      <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3.5 pointer-events-none">
        <i
          class="fa-solid fa-user-group"
          [class.text-gray-400]="!genderError"
          [class.text-red-600]="genderError"
        ></i>
      </div>
      <select
        formControlName="gender"
        id="gender"
        class="bg-gray-50 border text-gray-900 text-sm rounded-xl block w-full ps-10 p-3"
        [class]="
          genderError
            ? 'border-red-500 focus:ring-red-500 focus:border-red-500'
            : 'border-gray-300 focus:ring-mainColor focus:border-mainColor'
        "
      >
        <option value="" disabled>Select gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    @if (genderError) {
      <p class="mt-1.5 text-sm text-red-600" role="alert">Please select your gender.</p>
    }
  </div>

  <app-input-field
    [control]="registerForm.controls.dateOfBirth"
    inputId="dateOfBirth"
    inputType="date"
    label="Date of birth"
    icon="fa-regular fa-calendar"
    [errorMessages]="{ required: 'Please enter your date of birth.' }"
  />

  <app-input-field
    [control]="registerForm.controls.password"
    inputId="password"
    inputType="password"
    label="Password"
    icon="fa-solid fa-key"
    [errorMessages]="{
      required: 'Please enter a password.',
      pattern:
        'Your password must be at least 8 characters and include an uppercase letter, a lowercase letter, a number, and a special character (like ! &#64; # $).',
    }"
  />

  <app-input-field
    [control]="registerForm.controls.rePassword"
    inputId="rePassword"
    inputType="password"
    label="Confirm password"
    icon="fa-solid fa-key"
    [errorMessages]="{ required: 'Please confirm your password.' }"
  />

  <button
    [disabled]="registerForm.invalid"
    type="submit"
    class="w-full text-white bg-mainColor hover:bg-teal-800 focus:ring-4 focus:outline-none focus:ring-teal-300 font-semibold rounded-xl text-base px-5 py-3 text-center transition-colors disabled:bg-gray-300"
  >
    Create New Account
  </button>
</form>
