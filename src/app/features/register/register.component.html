<h2 class="text-2xl font-bold text-gray-900">Create a new account</h2>
<p class="text-sm text-gray-500 mb-6">It's quick and easy.</p>

<form (ngSubmit)="register()" class="space-y-4" [formGroup]="registerForm">
  <div class="relative">
    <label for="name" class="sr-only">Full name</label>
    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3.5 pointer-events-none">
      <i class="fa-regular fa-user text-gray-400"></i>
    </div>
    <input
      formControlName="name"
      type="text"
      id="name"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-mainColor focus:border-mainColor block w-full ps-10 p-3"
      placeholder="Full name"
    />
  </div>

  <div class="relative">
    <label for="username" class="sr-only">Username (optional)</label>
    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3.5 pointer-events-none">
      <i class="fa-solid fa-at text-gray-400"></i>
    </div>
    <input
      formControlName="userName"
      type="text"
      id="username"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-mainColor focus:border-mainColor block w-full ps-10 p-3"
      placeholder="Username (optional)"
    />
  </div>

  <div class="relative">
    <label for="email" class="sr-only">Email address</label>
    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3.5 pointer-events-none">
      <i class="fa-regular fa-envelope text-gray-400"></i>
    </div>
    <input
      formControlName="email"
      type="email"
      id="email"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-mainColor focus:border-mainColor block w-full ps-10 p-3"
      placeholder="Email address"
    />
  </div>

  <div class="relative">
    <label for="gender" class="sr-only">Gender</label>
    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3.5 pointer-events-none">
      <i class="fa-solid fa-user-group text-gray-400"></i>
    </div>
    <select
      formControlName="gender"
      id="gender"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-mainColor focus:border-mainColor block w-full ps-10 p-3"
    >
      <option value="" selected disabled>Select gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>
  </div>

  <div class="relative">
    <label for="dateOfBirth" class="sr-only">Date of birth</label>
    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3.5 pointer-events-none">
      <i class="fa-regular fa-calendar text-gray-400"></i>
    </div>
    <input
      formControlName="dateOfBirth"
      type="date"
      id="dateOfBirth"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-mainColor focus:border-mainColor block w-full ps-10 p-3"
    />
  </div>

  <div class="relative">
    <label for="password" class="sr-only">Password</label>
    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3.5 pointer-events-none">
      <i class="fa-solid fa-key text-gray-400"></i>
    </div>
    <input
      formControlName="password"
      type="password"
      id="password"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-mainColor focus:border-mainColor block w-full ps-10 p-3"
      placeholder="Password"
    />
  </div>

  <div class="relative">
    <label for="rePassword" class="sr-only">Confirm password</label>
    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3.5 pointer-events-none">
      <i class="fa-solid fa-key text-gray-400"></i>
    </div>
    <input
      formControlName="rePassword"
      type="password"
      id="rePassword"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-mainColor focus:border-mainColor block w-full ps-10 p-3"
      placeholder="Confirm password"
    />
  </div>

  <button
    type="submit"
    class="w-full text-white bg-mainColor hover:bg-teal-800 focus:ring-4 focus:outline-none focus:ring-teal-300 font-semibold rounded-xl text-base px-5 py-3 text-center transition-colors"
  >
    Create New Account
  </button>
</form>
