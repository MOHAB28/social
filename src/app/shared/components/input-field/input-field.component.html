@let showError = control().invalid && control().touched;

<div class="relative">
  <label [for]="inputId()" class="sr-only">{{ label() }}</label>
  <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3.5 pointer-events-none">
    <i [class]="icon()" [class.text-gray-400]="!showError" [class.text-red-600]="showError"></i>
  </div>
  <input
    [formControl]="control()"
    [type]="inputType()"
    [id]="inputId()"
    [placeholder]="label()"
    class="bg-gray-50 border text-gray-900 text-sm rounded-xl block w-full ps-10 p-3"
    [class]="
      showError
        ? 'border-red-500 focus:ring-red-500 focus:border-red-500'
        : 'border-gray-300 focus:ring-mainColor focus:border-mainColor'
    "
  />
</div>

@if (showError && errorMessage) {
  <p class="mt-1.5 text-sm text-red-600" role="alert">{{ errorMessage }}</p>
}
